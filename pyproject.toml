[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nessus-drata"
version = "0.1.0"
description = "Tenable Nessus (on-prem) to Drata Custom Connection MVP collector"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "lxml>=5.2,<6",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "responses>=0.25",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
